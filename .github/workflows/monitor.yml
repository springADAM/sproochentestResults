
name: INL Results Monitor

on:
  schedule:
    # UTC schedule: Luxembourg is UTC+2 during October 2026.
    # Runs at minute 7, from 07:00 through 16:00 UTC.
    - cron: "7 7-16 14-24 10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inl-results-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Luxembourg monitoring window
        id: window
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("Europe/Luxembourg"))

          start = datetime(2026, 10, 14, 9, 0, tzinfo=now.tzinfo)
          end = datetime(2026, 10, 24, 19, 0, tzinfo=now.tzinfo)

          allowed = start <= now < end and 9 <= now.hour < 19

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run={'true' if allowed else 'false'}\n")

          print(f"Luxembourg local time: {now.isoformat()}")
          print(f"Monitoring window active: {allowed}")
          PY

      - name: Install Python dependencies
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Run INL results monitor
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYINL_EMAIL: ${{ secrets.MYINL_EMAIL }}
          MYINL_PASSWORD: ${{ secrets.MYINL_PASSWORD }}
          MYINL_REGISTRATION_URL: https://myinl.inll.lu/my/exam/registrations
          EXAM_DATE: "30/09/2026"
        run: python monitor.py

      - name: Persist monitoring state
        if: success() && (steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update INL monitoring state"
            git push
          fi

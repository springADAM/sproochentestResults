
name: INL Results Monitor

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inl-results-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium


      - name: Test Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": "INL monitor diagnostic: Telegram delivery works."
              },
              timeout=20,
          )

          print("Telegram HTTP status:", response.status_code)
          data = response.json()
          print("Telegram API ok:", data.get("ok"))

          if not data.get("ok"):
              print("Telegram error:", data.get("description", "Unknown error"))
              raise SystemExit(1)
          PY

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYINL_EMAIL: ${{ secrets.MYINL_EMAIL }}
          MYINL_PASSWORD: ${{ secrets.MYINL_PASSWORD }}
          MYINL_REGISTRATION_URL: ${{ vars.MYINL_REGISTRATION_URL }}
          EXAM_DATE: "30/09/2026"
        run: python monitor.py

      - name: Save updated state
        if: success()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update INL monitoring state"
            git push
          fi
